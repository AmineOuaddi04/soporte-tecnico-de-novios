<script type="module">
const config = {"url": "https://llpvckwiphlcsuglikoz.supabase.co", "key": "sb_publishable_JE4Fhre_x6mbAG3a81Kj9Q_ts6UB0u1", "pushKey": "BP0xbB_IZerAx7y4gTN2nnXNw11KLpIWqKLrEkFngNCaHfZB5Sm977rX1VEzXUKPQq1rWEw-1Mb5vb4hyZtG7cs"};

const $ = id => document.getElementById(id);
const demo = !config.url;
const demoName = "Tú";
const presetTitles = ["Mi novio está demasiado lejos", "Necesito que me hagas reír", "Te echo de menos", "Solicito un abrazo"];
let db, member, tickets = [], recordingCancel, filter = "all";
const registration = navigator.serviceWorker?.register("./sw.js").catch(() => null);
const date = value => new Intl.DateTimeFormat("es", { dateStyle: "short", timeStyle: "short" }).format(new Date(value));
const params = new URL(location.href).searchParams;

function element(tag, text, className) {
  const node = document.createElement(tag);
  node.textContent = text;
  if (className) node.className = className;
  return node;
}

function report(message) {
  $("status").textContent = message;
}

function run(control, action, feedback = report) {
  if (control) control.disabled = true;
  return (async () => action())().catch(error => feedback(error.message))
    .finally(() => { if (control) control.disabled = false; });
}

function saveDemo() {
  localStorage.setItem("soporte-demo", JSON.stringify(tickets));
}

async function value(query) {
  const { data, error } = await query;
  if (error) throw Error(error.message);
  return data;
}

async function loadTickets() {
  if (!demo) {
    tickets = await value(db.from("tickets").select("*,author:members(name)").order("created_at", { ascending: false }));
  }
  renderTickets();
}

function renderTickets() {
  const list = $("tickets");
  const open = tickets.filter(ticket => !ticket.closed).length;
  $("all-count").textContent = tickets.length;
  $("open-count").textContent = open;
  $("closed-count").textContent = tickets.length - open;
  const query = $("search").value.trim().toLocaleLowerCase("es");
  const matches = tickets.filter(ticket =>
    (filter === "all" || ticket.closed === (filter === "closed")) &&
    (ticket.title + " " + ticket.author.name).toLocaleLowerCase("es").includes(query));
  list.replaceChildren();
  if (!matches.length) list.append(element("p", "No hay incidencias en esta vista.", "empty"));
  for (const ticket of matches) {
    const button = element("button", "", "ticket");
    const content = element("span", "", "ticket-copy");
    content.append(element("span", ticket.title), element("small", `${ticket.author.name} · ${date(ticket.created_at)}`));
    button.append(content, element("small", ticket.closed ? "Resuelta" : "Abierta", ticket.closed ? "badge done" : "badge"));
    button.onclick = () => run(button, () => openTicket(ticket.id));
    list.append(button);
  }
}

async function createTicket(title) {
  title = title.trim();
  if (!title) throw Error("Escribe un título para el ticket.");
  let id;
  if (demo) {
    id = crypto.randomUUID();
    tickets.unshift({ id, title, author: { name: demoName }, created_at: new Date(), replies: [] });
    saveDemo();
  } else {
    const ticket = await value(db.from("tickets").insert({ title, author_id: member.id }).select("id").single());
    id = ticket.id;
  }
  await loadTickets();
  $("composer").close();
  await openTicket(id);
}

async function openTicket(id) {
  const ticket = tickets.find(row => row.id === id);
  if (!ticket) return;
  const replies = demo ? ticket.replies : await value(db.from("replies")
    .select("*,author:members(name)").eq("ticket_id", id).order("created_at"));
  recordingCancel?.(false);
  const thread = $("thread");
  thread.replaceChildren(element("h2", ticket.title), element("small",
    `${ticket.author.name} · ${date(ticket.created_at)} · ${ticket.closed ? "Resuelto 💛" : "Abierto"}`));
  for (const reply of replies) {
    const card = element("div", "", "reply");
    card.append(element("small", `${reply.author.name} · ${date(reply.created_at)}`));
    if (reply.body) card.append(element("p", reply.body));
    if (reply.audio) {
      const player = document.createElement("audio");
      player.controls = true;
      player.preload = "none";
      player.src = reply.audio;
      card.append(player);
    }
    thread.append(card);
  }
  const feedback = element("p", "");
  feedback.setAttribute("role", "status");
  const explain = message => { feedback.textContent = message; };
  async function reply(fields) {
    if (demo) {
      ticket.replies.push({ ...fields, author: { name: demoName }, created_at: new Date() });
      saveDemo();
    } else {
      await value(db.from("replies").insert({ ...fields, ticket_id: id, author_id: member.id }));
    }
    await openTicket(id);
  }

  const form = document.createElement("form");
  const label = element("label", "Tu respuesta");
  const input = document.createElement("textarea");
  input.required = true;
  input.maxLength = 1000;
  label.append(input);
  const send = element("button", "Enviar respuesta");
  form.append(label, send);
  form.onsubmit = event => {
    event.preventDefault();
    const body = input.value.trim();
    if (body) run(send, () => reply({ body }), explain);
  };
  const mic = element("button", "Grabar audio", "quiet");
  mic.onclick = () => run(mic, () => record(mic, reply, explain), explain);
  const toggle = element("button", ticket.closed ? "Sigo esperando mi abrazo" : "Marcar como resuelto 💛", "quiet");
  toggle.onclick = () => run(toggle, async () => {
    if (demo) {
      ticket.closed = !ticket.closed;
      saveDemo();
    } else {
      await value(db.from("tickets").update({ closed: !ticket.closed }).eq("id", id));
    }
    await loadTickets();
    await openTicket(id);
  }, explain);
  thread.append(feedback, form, mic, toggle);
  if (!$("detail").open) $("detail").showModal();
}

async function record(button, reply, feedback) {
  if (recordingCancel) {
    recordingCancel(true);
    return;
  }
  if (!navigator.mediaDevices?.getUserMedia || !window.MediaRecorder) throw Error("Abre la web en Safari o Chrome para grabar.");
  const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
  if (!$("detail").open || !button.isConnected) {
    stream.getTracks().forEach(track => track.stop());
    return;
  }
  let recorder;
  try {
    recorder = new MediaRecorder(stream, { audioBitsPerSecond: 32000 });
  } catch (error) {
    stream.getTracks().forEach(track => track.stop());
    throw error;
  }
  const chunks = [];
  let sendAudio = false;
  recorder.ondataavailable = event => chunks.push(event.data);
  recorder.onstop = () => {
    stream.getTracks().forEach(track => track.stop());
    if (!sendAudio || !$("detail").open || !button.isConnected) return;
    const blob = new Blob(chunks, { type: (recorder.mimeType || chunks[0]?.type || "audio/webm").split(";")[0] });
    if (!blob.size || blob.size > 750000) return feedback("Prueba con un audio más corto.");
    const reader = new FileReader();
    reader.onload = () => run(button, () => reply({ audio: reader.result }), feedback);
    reader.onerror = () => feedback("No se pudo leer el audio.");
    reader.readAsDataURL(blob);
  };
  recorder.onerror = () => {
    recordingCancel?.(false);
    stream.getTracks().forEach(track => track.stop());
    feedback("Se ha interrumpido la grabación.");
  };
  try {
    recorder.start();
  } catch (error) {
    stream.getTracks().forEach(track => track.stop());
    throw error;
  }
  button.textContent = "Parar y enviar audio";
  feedback("Grabando… hasta 30 segundos. Cierra el ticket para cancelar.");
  const timer = setTimeout(() => recordingCancel?.(true), 30000);
  recordingCancel = send => {
    clearTimeout(timer);
    recordingCancel = null;
    sendAudio = send;
    if (recorder.state !== "inactive") recorder.stop();
    button.textContent = "Grabar audio";
    feedback(send ? "Preparando audio…" : "");
  };
}

function showView(view) {
  if ($("app").hidden) return;
  const settings = view === "settings";
  $("history").hidden = settings;
  $("settings").hidden = !settings;
  $("page-title").textContent = settings ? "Notificaciones" : "Para cuando estamos lejos.";
  $("description").textContent = settings ? "Para enterarte cuando el otro se acuerde de ti." : "El teletransporte sigue en mantenimiento.";
  $("breadcrumb").textContent = settings ? "Preferencias" : "Entre tú y yo";
  document.querySelectorAll("[data-view]").forEach(button => {
    if (button.dataset.view === view) button.setAttribute("aria-current", "page");
    else button.removeAttribute("aria-current");
  });
  if (settings) showSettings();
}

function showSettings() {
  if (demo) $("push-help").textContent = "Modo demo. Los avisos entre móviles se activan al conectar Supabase.";
  else if (/iPhone|iPad|iPod/.test(navigator.userAgent) && !navigator.standalone && !matchMedia("(display-mode: standalone)").matches) {
    $("push-help").textContent = "En Safari, toca Compartir → Añadir a pantalla de inicio. Abre la web desde su icono y vuelve a tocar Activar notificaciones.";
  }
}

async function activatePush() {
  if (demo) return showSettings();
  if (!window.PushManager || !window.Notification || !registration) {
    if (/iPhone|iPad|iPod/.test(navigator.userAgent) && !navigator.standalone && !matchMedia("(display-mode: standalone)").matches) return showSettings();
    showSettings();
    throw Error("Para activar los avisos, sigue las instrucciones de arriba o abre la web en un navegador compatible.");
  }
  if (!config.pushKey) throw Error("Falta configurar la clave pública de notificaciones.");
  const permission = await Notification.requestPermission();
  if (permission !== "granted") throw Error("Puedes permitir los avisos desde los ajustes del navegador o del móvil.");
  const worker = await registration;
  if (!worker) throw Error("No se pudo preparar este móvil para los avisos.");
  const sub = await worker.pushManager.getSubscription() ?? await worker.pushManager.subscribe({
    userVisibleOnly: true,
    applicationServerKey: config.pushKey,
  });
  await value(db.from("subscriptions").upsert({ member_id: member.id, endpoint: sub.endpoint, payload: sub.toJSON() }));
  $("push-help").textContent = "Avisos activados en este dispositivo.";
}

async function start() {
  if (demo) {
    $("connection").textContent = "Modo demo";
    tickets = JSON.parse(localStorage.getItem("soporte-demo") || "null") ?? [{
      id: "bienvenida", title: "Incidencia #001 · El teletransporte sigue en mantenimiento",
      author: { name: "Soporte" }, created_at: new Date(), replies: [{
        author: { name: "Soporte" }, created_at: new Date(),
        body: "Hemos intentado reiniciar al novio. Sigue echándote de menos.",
      }],
    }];
  } else {
    const { createClient } = await import("https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.89.0/+esm");
    db = createClient(config.url, config.key);
    const { session } = await value(db.auth.getSession());
    if (!session) {
      $("login").hidden = false;
      return;
    }
    $("logout").hidden = false;
    member = await value(db.from("members").select("id,name").eq("id", session.user.id).maybeSingle());
    if (!member) throw Error("Esta cuenta todavía no tiene acceso al servicio técnico.");
  }
  await loadTickets();
  $("app").hidden = false;
  $("compose").hidden = false;
  $("connection").textContent = demo ? "Modo demo" : member.name;
  showView("history");
  if (!demo) {
    const worker = await registration;
    const subscribed = await worker?.pushManager?.getSubscription();
    if (!subscribed && !sessionStorage.getItem("soporte-push-later") && !params.has("ticket")) showView("settings");
    window.addEventListener("focus", () => run(null, loadTickets));
    setInterval(() => { if (!document.hidden) run(null, loadTickets); }, 15000);
  }
  if (params.has("ticket")) await openTicket(params.get("ticket"));
}

for (const title of presetTitles) {
  const button = element("button", title, "preset");
  button.onclick = () => { $("new-ticket").elements.title.value = title; $("new-ticket").elements.title.focus(); };
  $("presets").append(button);
}
$("login").onsubmit = event => {
  event.preventDefault();
  const form = new FormData(event.target);
  run(event.submitter, async () => {
    const code = form.get("code").trim();
    const role = code.startsWith("A-") ? "a" : code.startsWith("D-") ? "d" : null;
    if (!role) throw Error("Comprueba tu código de acceso.");
    const { error } = await db.auth.signInWithPassword({ email: role + "@soporte.example", password: code });
    if (error) throw Error("Ese código no coincide. Comprueba que lo has copiado entero.");
    location.reload();
  });
};
$("logout").onclick = () => run($("logout"), async () => {
  await value(db.auth.signOut());
  location.reload();
});
$("new-ticket").onsubmit = event => {
  event.preventDefault();
  run(event.submitter, async () => {
    await createTicket(new FormData(event.target).get("title"));
    event.target.reset();
  }, message => { $("compose-feedback").textContent = message; });
};
$("reboot").onclick = () => report("Reinicio completado. Sigue echándote de menos 💛");
$("refresh").onclick = () => run($("refresh"), loadTickets);
$("back").onclick = () => $("detail").close();
$("detail").onclose = () => recordingCancel?.(false);
document.querySelectorAll("[data-view]").forEach(button => {
  button.onclick = () => showView(button.dataset.view);
});
document.querySelectorAll("[data-filter]").forEach(button => {
  button.onclick = () => {
    filter = button.dataset.filter;
    document.querySelectorAll("[data-filter]").forEach(item => item.setAttribute("aria-pressed", String(item === button)));
    renderTickets();
  };
});
$("search").oninput = renderTickets;
$("compose").onclick = () => {
  showView("history");
  $("compose-feedback").textContent = "";
  $("composer").showModal();
};
$("close-composer").onclick = () => $("composer").close();
$("later").onclick = () => {
  sessionStorage.setItem("soporte-push-later", "1");
  showView("history");
};
$("push").onclick = () => run($("push"), activatePush, message => { $("push-help").textContent = message; });
run(null, start);
</script>
</head>
<body>
<div class="workspace">
<aside class="sidebar">
<a class="identity" href="./"><span class="mark" aria-hidden="true">♡</span><span>Soporte técnico<small>de novios</small></span></a>
<nav aria-label="Secciones">
<button class="nav" data-view="history" aria-current="page"><span aria-hidden="true">▤</span> Incidencias</button>
<button class="nav" id="show-settings" data-view="settings"><span aria-hidden="true">◉</span> Notificaciones</button>
</nav>
<div class="sidebar-footer"><span class="signal"></span><span id="connection">Conectando</span><button id="logout" class="quiet" hidden>Salir</button></div>
</aside>
<main>
<div class="topbar"><span id="breadcrumb">Entre tú y yo</span><button id="compose" hidden>＋ Nueva incidencia</button></div>
<section class="intro"><h1 id="page-title">Para cuando estamos lejos.</h1><p id="description">El teletransporte sigue en mantenimiento.</p></section>
<p id="status" class="feedback" role="status"></p>
<form id="login" class="panel login" hidden>
<h2>Entrar al espacio compartido</h2>
<label>Código de acceso<input name="code" required autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="Tu código personal"></label>
<button type="submit">Entrar</button>
</form>
<div id="app" hidden>
<section id="settings" class="panel notice" hidden>
<h2>Avisos en este dispositivo</h2><p id="push-help">Recibe un aviso cuando llegue una incidencia o una respuesta.</p>
<div class="actions"><button id="push">Activar notificaciones</button><button id="later" class="quiet">Volver a incidencias</button></div></section>
<section id="history">
<div class="tools">
<div class="filters" aria-label="Filtrar incidencias">
<button data-filter="all" aria-pressed="true">Todas <span id="all-count">0</span></button>
<button data-filter="open" aria-pressed="false">Abiertas <span id="open-count">0</span></button>
<button data-filter="closed" aria-pressed="false">Resueltas <span id="closed-count">0</span></button>
</div>
<div class="utility"><input type="search" id="search" placeholder="Buscar" aria-label="Buscar incidencias"><button class="quiet" id="refresh" aria-label="Actualizar incidencias" title="Actualizar">↻</button></div>
</div>

<div id="tickets"></div>
<button class="quiet reboot" id="reboot">↻ Reiniciar novio</button>
</section>
</div>
</main>
</div>
<dialog id="composer" aria-labelledby="compose-heading">
<div class="dialog-top"><h2 id="compose-heading">Nueva incidencia</h2><button id="close-composer" class="quiet" aria-label="Cerrar">×</button></div>
<div id="presets" class="presets"></div>
<form id="new-ticket"><label>Título de la incidencia<input name="title" maxlength="120" required placeholder="¿Qué necesita el servicio técnico?"></label><p id="compose-feedback" class="feedback" role="status"></p><button>Enviar incidencia</button></form>
</dialog>
<dialog id="detail" aria-label="Detalle de la incidencia"><div class="dialog-top"><span class="label">Incidencia</span><button id="back" class="quiet" aria-label="Cerrar incidencia">×</button></div><div id="thread"></div></dialog>
</body>
</html>
